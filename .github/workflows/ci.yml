name: CI — Human Digital Twin

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn fastapi httpx pytest pytest-asyncio \
                      pydantic requests loguru rich aiohttp xgboost

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short --no-header

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short --no-header

      - name: Test API startup
        run: |
          python -c "from src.api.main import app; print('API imports OK')"

      - name: Test dashboard startup
        run: |
          python -c "import importlib.util; spec = importlib.util.spec_from_file_location('app', 'src/dashboard/app.py'); print('Dashboard module found')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check src/ tests/ --ignore E501,F401 || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Security scan
        run: bandit -r src/ -ll -q || true
