[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "human-digital-twin"
version = "0.1.0"
description = "Human Digital Twin — predicting the effect of natural products on physiological biomarkers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["digital-twin", "pharmacokinetics", "natural-products", "physiology", "AI", "healthcare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core scientific
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "sympy>=1.12",
    # ML / AI
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "torch>=2.2",
    "shap>=0.44",
    # Bioinformatics
    "biopython>=1.83",
    "rdkit>=2023.9",
    # API / Backend
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    # Database
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    # Dashboard
    "streamlit>=1.32",
    "plotly>=5.19",
    "altair>=5.2",
    # Data fetching
    "requests>=2.31",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    # Utilities
    "loguru>=0.7",
    "rich>=13.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "black>=24.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "httpx>=0.27",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
hdt = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
